# main への push のときだけ、全 job の成功後に deploy (deploy-yunirun.yml) を呼ぶ。
# 定期の依存監査は security.yml が受け持つ。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check:type

      - name: Run linter
        run: bun run check:lint

      - name: Run tests
        run: bun run check:test

      - name: Build project
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run check:e2e

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t web .

      - name: Test Docker image
        run: |
          docker run --rm -d -p 3000:3000 --name test-container web
          sleep 5
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container

  deploy:
    # test / e2e / security / docker がすべて成功した main への push だけ。
    # OIDC の sub は ref:refs/heads/main になり、VPS 側の認可と一致する。
    needs: [test, e2e, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-yunirun.yml
    # 呼ばれる側の job が使う権限の上限。再利用ワークフローは呼び出し側より
    # 多い権限を持てないので、足りないと startup_failure になる。
    permissions:
      contents: read
      id-token: write
      packages: write
    secrets: inherit
