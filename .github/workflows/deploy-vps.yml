# VPS へのデプロイ
#
# 認証に長期の SSH 秘密鍵は使わない。GitHub Actions の OIDC トークンから
# opkssh が短命の SSH 証明書を発行し、それで VPS に入る。VPS 側は
# repo:yuniruyuni/web:ref:refs/heads/main という sub だけを
# deploy-web ユーザ (sudo なし) として受け付ける。
#
# 注意: この job に environment: を付けてはいけない。environment を使うと
# sub が repo:OWNER/REPO:environment:NAME に変わり、VPS 側の認可と一致しなくなる。
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # デプロイの中断は blue/green の入れ替えを中途半端な状態で止めうるので
  # 途中キャンセルはしない。
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    # 再利用ワークフローは呼び出し側より多い権限を持てないため明示的に渡す。
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      dockerfile: Dockerfile
      image_name: web
    secrets: inherit

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # opkssh が OIDC トークンを取得するのに必須
      id-token: write
      contents: read
      # VPS が GHCR から image を pull するためのトークンを渡すのに使う
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -Lf "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Install opkssh
        # バージョンは VPS 側と揃える。v0.10.0 は証明書の principals を空にするため
        # OpenSSH 10 に拒否される。
        env:
          OPKSSH_VERSION: v0.16.0
          OPKSSH_SHA256: c018c3e7baf98612b923e742dd87be38650bf61e3b755fb2bc90de177568b1bf
        run: |
          curl -sSLf "https://github.com/openpubkey/opkssh/releases/download/${OPKSSH_VERSION}/opkssh-linux-amd64" -o /usr/local/bin/opkssh
          echo "${OPKSSH_SHA256}  /usr/local/bin/opkssh" | sha256sum -c -
          chmod +x /usr/local/bin/opkssh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp ssh/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'SSHCONF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Login (OIDC -> short-lived SSH certificate)
        run: opkssh login github

      - name: Deploy
        env:
          # VPS 側が GHCR から pull するために使う。job の終了とともに失効するので
          # VPS には長期の資格情報を残さない。
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # トークンは argv ではなく stdin で渡す (ps に出さない)。
          printf '%s' "$GHCR_TOKEN" \
            | ssh -o ConnectTimeout=20 deploy-web@ssh.yuniruyuni.net "app-deploy $SHA"
