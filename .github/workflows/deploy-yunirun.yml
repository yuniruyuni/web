# yunirun 経由での VPS デプロイ (検証中)
#
# 既存の deploy-vps.yml と並行して動く。yuniruyuni.net 側のアプリ名が web2 な
# ので、コンテナも HAProxy の経路も既存とは別に立つ。検証が済んだら
# deploy-vps.yml を置き換える。
#
# 既存版との違いは、VPS 側の受け口が app-deploy ではなく yunirun deploy で、
# yunirun.jsonc をデプロイ時に一緒に運ぶこと。VPS が GitHub を取りに行かない
# ので、private リポジトリでも認証情報を置かずに済む。
name: Deploy via yunirun

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yunirun-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    # build-image.yml が宣言している権限を渡す。再利用ワークフローは呼び出し側より
    # 多い権限を持てないので、足りないとワークフロー自体が読み込みを拒否され
    # startup_failure になる。
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      dockerfile: Dockerfile
      image_name: web
    secrets: inherit

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # opkssh が OIDC トークンを取得するのに必須
      id-token: write
      contents: read
      # GHCR への push と、VPS へ渡す pull 用トークンに使う
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cloudflared
        run: |
          CLOUDFLARED_VERSION="2026.7.3"
          curl -Lf "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Install opkssh
        # バージョンは VPS 側と揃える。v0.10.0 は証明書の principals を空にするため
        # OpenSSH 10 に拒否される。
        env:
          OPKSSH_VERSION: v0.16.0
          OPKSSH_SHA256: c018c3e7baf98612b923e742dd87be38650bf61e3b755fb2bc90de177568b1bf
        run: |
          curl -sSLf "https://github.com/openpubkey/opkssh/releases/download/${OPKSSH_VERSION}/opkssh-linux-amd64" -o /usr/local/bin/opkssh
          echo "${OPKSSH_SHA256}  /usr/local/bin/opkssh" | sha256sum -c -
          chmod +x /usr/local/bin/opkssh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp ssh/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config << 'SSHCONF'
          Host ssh.yuniruyuni.net
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking yes
          SSHCONF
          chmod 600 ~/.ssh/config

      - name: Login (OIDC -> short-lived SSH certificate)
        run: opkssh login github

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # トークンとマニフェストを stdin の JSON で渡す。argv に載せると
          # ps から見えるため、また VPS が GitHub を取りに行かずに済むため。
          jq -n \
            --arg token "$GHCR_TOKEN" \
            --rawfile manifest yunirun.jsonc \
            '{token: $token, manifest: $manifest}' \
            | ssh -o ConnectTimeout=20 yunirun-web2@ssh.yuniruyuni.net "yunirun deploy $SHA"
